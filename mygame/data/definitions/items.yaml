# Item definitions for RTS Combat Overworld
# Top-level keys: items (list) and production_map (dict)
#
# Weight reference (design §9): light gear 2-5; rifle/armor 8-15; heavy 25-40;
# ammo ~0.1; consumables ~1-5; grenade ~3. Every item carries a `weight`.
# resource_weights lives in balance.yaml (do not duplicate here).
#
# craft_cost: resources spent to make one unit via the `craft` command at the
# matching equipment building (Armory=modern gear/ammo, Lab=futuristic gear/
# throwables, Medbay=consumables). Omit/null to make an item non-craftable.
# Agents assigned to those buildings also produce the same items passively
# (and pay the same craft_cost from the owner's resources).

items:
  # ------------------------------------------------------------------ #
  #  Weapons (Gear, slot: weapon_melee or weapon_ranged, by weapon_type)
  # ------------------------------------------------------------------ #
  # roll_spec calibration (item-loot-economy task 1.7, design §9): loot bands
  # put today's flat base at ~60-70%+ of max (a "good but not great" roll) with
  # min ≈ base − 30%; craft bands are a tighter reliable floor topping out AT
  # the base (never exceeding a good loot roll). Weapons weight damage 3× over
  # range (§2.1); melee weapons roll damage only (combat forces melee range 1).
  # Ammo, consumables, fuel, throwables and mines stay unrolled (R1.3).
  - key: combat_knife
    name: Combat Knife
    slot: weapon_melee
    category: weapon
    weapon_type: melee
    stat_modifiers:
      damage: 10
      range: 1
    roll_spec:
      stats:
        damage: {min: 7, max: 12, weight: 3}
      craft:
        damage: {min: 9, max: 10}
      affix_pool: weapon
    ammo_cost: null
    craft_cost:
      Iron: 5
    weight: 3.0
    classification: modern
    required_rank: null

  - key: assault_rifle
    name: Assault Rifle
    slot: weapon_ranged
    category: weapon
    weapon_type: ranged
    stat_modifiers:
      damage: 25
      range: 5
    # The design §1.1 worked example — kept verbatim as the calibration anchor.
    roll_spec:
      stats:
        damage: {min: 18, max: 30, weight: 3}
        range: {min: 4, max: 7, weight: 1}
      craft:
        damage: {min: 20, max: 25}
        range: {min: 4, max: 5}
      affix_pool: weapon
    ammo_cost:
      Iron: 1
    craft_cost:
      Iron: 25
      Wood: 10
    weight: 10.0
    classification: modern
    required_rank: null

  - key: plasma_rifle
    name: Plasma Rifle
    slot: weapon_ranged
    category: weapon
    weapon_type: ranged
    stat_modifiers:
      damage: 40
      range: 6
    roll_spec:
      stats:
        damage: {min: 29, max: 48, weight: 3}
        range: {min: 5, max: 8, weight: 1}
      craft:
        damage: {min: 36, max: 40}
        range: {min: 5, max: 6}
      affix_pool: weapon
    ammo_cost:
      Energy: 2
    craft_cost:
      Iron: 20
      Energy: 30
      Circuits: 10
    weight: 12.0
    classification: futuristic
    required_rank: Staff_Sergeant

  - key: sniper_rifle
    name: Sniper Rifle
    slot: weapon_ranged
    category: weapon
    weapon_type: ranged
    stat_modifiers:
      damage: 50
      range: 12
    # Range band deliberately tight (§9: range is the spiciest stat; the
    # max_weapon_range cap catches the worst-case stack).
    roll_spec:
      stats:
        damage: {min: 36, max: 60, weight: 3}
        range: {min: 10, max: 13, weight: 1}
      craft:
        damage: {min: 45, max: 50}
        range: {min: 11, max: 12}
      affix_pool: weapon
    ammo_cost:
      Iron: 2
    craft_cost:
      Iron: 40
      Wood: 15
    weight: 14.0
    classification: modern
    required_rank: Corporal

  # Magazine-based rifle exercising the reload model (D5): draws from the
  # `rifle_rounds` Supply_Bag reserve via reload, fires from db.loaded.
  - key: service_rifle
    name: Service Rifle
    slot: weapon_ranged
    category: weapon
    weapon_type: ranged
    stat_modifiers:
      damage: 22
      range: 5
    roll_spec:
      stats:
        damage: {min: 16, max: 26, weight: 3}
        range: {min: 4, max: 7, weight: 1}
      craft:
        damage: {min: 20, max: 22}
        range: {min: 4, max: 5}
      affix_pool: weapon
    ammo_type: rifle_rounds
    ammo_per_shot: 1
    magazine_size: 30
    ammo_cost: null
    craft_cost:
      Iron: 20
      Wood: 10
    weight: 9.0
    classification: modern
    required_rank: null

  # ------------------------------------------------------------------ #
  #  Typed-damage weapons (Phase 3 — ignore physical DR, read typed resist)
  # ------------------------------------------------------------------ #
  - key: incendiary_rifle
    name: Incendiary Rifle
    slot: weapon_ranged
    category: weapon
    weapon_type: ranged
    damage_type: fire
    stat_modifiers:
      damage: 20
      range: 5
    roll_spec:
      stats:
        damage: {min: 14, max: 24, weight: 3}
        range: {min: 4, max: 7, weight: 1}
      craft:
        damage: {min: 18, max: 20}
        range: {min: 4, max: 5}
      affix_pool: weapon
    ammo_cost:
      Magmite: 1
    craft_cost:
      Iron: 25
      Magmite: 15
    weight: 11.0
    classification: futuristic
    required_rank: Major

  - key: psi_blade
    name: Psi Blade
    slot: weapon_melee
    category: weapon
    weapon_type: melee
    damage_type: psychic
    stat_modifiers:
      damage: 18
      range: 1
    roll_spec:
      stats:
        damage: {min: 13, max: 22, weight: 3}
      craft:
        damage: {min: 16, max: 18}
      affix_pool: weapon
    craft_cost:
      Aether: 10
      Circuits: 5
    weight: 3.0
    classification: futuristic
    required_rank: Colonel

  - key: blast_launcher
    name: Blast Launcher
    slot: weapon_ranged
    category: weapon
    weapon_type: ranged
    damage_type: blast
    stat_modifiers:
      damage: 30
      range: 4
    roll_spec:
      stats:
        damage: {min: 22, max: 36, weight: 3}
        range: {min: 3, max: 6, weight: 1}
      craft:
        damage: {min: 27, max: 30}
        range: {min: 3, max: 4}
      affix_pool: weapon
    ammo_cost:
      Iron: 3
    craft_cost:
      Iron: 30
      Cryogen: 10
    weight: 14.0
    classification: futuristic
    required_rank: Lieutenant

  # ------------------------------------------------------------------ #
  #  Armor (Gear) — one piece per body slot
  # ------------------------------------------------------------------ #
  - key: combat_helmet
    name: Combat Helmet
    slot: head
    category: armor
    stat_modifiers:
      damage_reduction: 3
    roll_spec:
      stats:
        damage_reduction: {min: 2, max: 5, weight: 1}
      craft:
        damage_reduction: {min: 2, max: 3}
      affix_pool: armor
    ammo_cost: null
    craft_cost:
      Iron: 10
      Stone: 5
    weight: 5.0
    classification: modern
    required_rank: null

  - key: kevlar_vest
    name: Kevlar Vest
    slot: torso
    category: armor
    stat_modifiers:
      damage_reduction: 5
    roll_spec:
      stats:
        damage_reduction: {min: 4, max: 8, weight: 1}
      craft:
        damage_reduction: {min: 4, max: 5}
      affix_pool: armor
    ammo_cost: null
    craft_cost:
      Iron: 20
      Stone: 10
    weight: 8.0
    classification: modern
    required_rank: null

  - key: power_armor
    name: Power Armor
    slot: torso
    category: armor
    stat_modifiers:
      damage_reduction: 15
    roll_spec:
      stats:
        damage_reduction: {min: 11, max: 22, weight: 1}
      craft:
        damage_reduction: {min: 13, max: 15}
      affix_pool: armor
    ammo_cost: null
    craft_cost:
      Iron: 30
      Energy: 40
      Circuits: 20
    weight: 30.0
    classification: futuristic
    required_rank: Captain

  - key: combat_gloves
    name: Combat Gloves
    slot: hands
    category: armor
    stat_modifiers:
      damage_reduction: 2
    roll_spec:
      stats:
        damage_reduction: {min: 1, max: 3, weight: 1}
      craft:
        damage_reduction: {min: 1, max: 2}
      affix_pool: armor
    ammo_cost: null
    craft_cost:
      Iron: 8
    weight: 3.0
    classification: modern
    required_rank: null

  - key: combat_greaves
    name: Combat Greaves
    slot: legs
    category: armor
    stat_modifiers:
      damage_reduction: 4
    roll_spec:
      stats:
        damage_reduction: {min: 3, max: 6, weight: 1}
      craft:
        damage_reduction: {min: 3, max: 4}
      affix_pool: armor
    ammo_cost: null
    craft_cost:
      Iron: 15
      Stone: 8
    weight: 7.0
    classification: modern
    required_rank: null

  - key: combat_boots
    name: Combat Boots
    slot: feet
    category: armor
    stat_modifiers:
      damage_reduction: 2
    roll_spec:
      stats:
        damage_reduction: {min: 1, max: 3, weight: 1}
      craft:
        damage_reduction: {min: 1, max: 2}
      affix_pool: armor
    ammo_cost: null
    craft_cost:
      Iron: 8
    weight: 4.0
    classification: modern
    required_rank: null

  # ------------------------------------------------------------------ #
  #  Accessories (Gear)
  # ------------------------------------------------------------------ #
  - key: scope
    name: Tactical Scope
    slot: eyes
    category: accessory
    stat_modifiers:
      sight_range: 3
    ammo_cost: null
    craft_cost:
      Iron: 10
      Wood: 5
    weight: 2.0
    classification: modern
    required_rank: null

  - key: jetpack
    name: Jetpack
    slot: back
    category: accessory
    stat_modifiers:
      move_speed: 2.0
    ammo_cost: null
    craft_cost:
      Iron: 15
      Energy: 25
      Circuits: 15
    weight: 12.0
    classification: futuristic
    required_rank: Staff_Sergeant

  # Cap-raiser: a hauler pack that lifts the weight limit via carry_capacity.
  - key: hauler_pack
    name: Hauler Pack
    slot: back
    category: accessory
    stat_modifiers:
      carry_capacity: 500
    ammo_cost: null
    craft_cost:
      Wood: 20
      Iron: 5
    weight: 5.0
    classification: modern
    required_rank: null

  # ---- Accessory gear on aggregating axes (item-loot-economy task 0.3) ----
  # Data-only: EquipmentHandler.get_stat_total sums a stat across ALL equipped
  # items with no key allowlist, so these fire_resist / damage_bonus values
  # flow straight into combat (_get_target_typed_resist reads <type>_resist;
  # _get_attacker_bonus reads damage_bonus) with zero engine changes.
  - key: thermal_cloak
    name: Thermal Cloak
    slot: back
    category: accessory
    stat_modifiers:
      fire_resist: 4
    ammo_cost: null
    craft_cost:
      Wood: 15
      Stone: 10
    weight: 4.0
    classification: modern
    required_rank: null

  - key: targeting_visor
    name: Targeting Visor
    slot: face
    category: accessory
    stat_modifiers:
      damage_bonus: 2
    ammo_cost: null
    craft_cost:
      Iron: 12
      Wood: 8
    weight: 2.0
    classification: modern
    required_rank: null

  # Futuristic trinket combining both aggregating axes on one item.
  - key: raider_talisman
    name: Raider Talisman
    slot: accessory
    category: accessory
    stat_modifiers:
      damage_bonus: 1
      fire_resist: 2
    ammo_cost: null
    craft_cost:
      Iron: 10
      Energy: 15
      Circuits: 5
    weight: 1.0
    classification: futuristic
    required_rank: Staff_Sergeant

  # ------------------------------------------------------------------ #
  #  Ammo (Supply — no slot; counted stacks)
  # ------------------------------------------------------------------ #
  - key: rifle_rounds
    name: Rifle Rounds
    category: ammo
    craft_cost:
      Iron: 2
    weight: 0.1
    max_stack: 200
    classification: modern
    required_rank: null

  - key: energy_cell
    name: Energy Cell
    category: ammo
    craft_cost:
      Energy: 3
    weight: 0.1
    max_stack: 200
    classification: futuristic
    required_rank: Staff_Sergeant

  # ------------------------------------------------------------------ #
  #  Fuel Cells (Supply — consumed by Launch Pad for cross-planet travel)
  # ------------------------------------------------------------------ #
  - key: basic_fuel_cell
    name: Basic Fuel Cell
    category: ammo
    craft_cost:
      Wood: 10
      Stone: 5
      Iron: 5
    weight: 2.0
    max_stack: 20
    classification: modern
    required_rank: null

  - key: premium_fuel_cell
    name: Premium Fuel Cell
    category: ammo
    craft_cost:
      Energy: 10
      Circuits: 5
    weight: 2.0
    max_stack: 20
    classification: futuristic
    required_rank: Staff_Sergeant

  # ------------------------------------------------------------------ #
  #  Consumables (Supply)
  # ------------------------------------------------------------------ #
  - key: medkit
    name: Medkit
    category: consumable
    effect:
      type: heal
      amount: 30
    # Terra-craftable: Biomass is the consumable resource (the permanent Terra
    # round-trip anchor per §4). Recruits can harvest Biomass from Plains/Dirt.
    craft_cost:
      Biomass: 5
      Stone: 2
    weight: 2.0
    max_stack: 20
    classification: modern
    required_rank: null

  - key: combat_stim
    name: Combat Stim
    category: consumable
    effect:
      type: buff
      stat: damage_bonus
      amount: 10
      duration_ticks: 30
    craft_cost:
      Energy: 5
      Circuits: 2
    weight: 1.0
    max_stack: 20
    classification: modern
    required_rank: Staff_Sergeant

  # ------------------------------------------------------------------ #
  #  Throwables — GRENADES (Supply). Thrown in a compass direction; fly to the
  #  first obstacle or max `range`, land, then a set fuse ticks down before the
  #  AoE explosion. `bomb_type: grenade` + fuse_min/fuse_max/fuse_default bound
  #  the `set <bomb> <sec>` fuse. `range` is the max throw distance (Chebyshev),
  #  `radius` the blast radius, `amount` the flat blast damage.
  # ------------------------------------------------------------------ #
  - key: frag_grenade
    name: Frag Grenade
    category: throwable
    effect:
      type: aoe_damage
      bomb_type: grenade
      amount: 40
      radius: 2
      range: 5
      fuse_min: 1
      fuse_max: 10
      fuse_default: 3
    # Terra-craftable basics only (see medkit): the frag grenade is a freely
    # craftable anti-armor equalizer new players rely on. Was Iron 10 / Energy 10.
    craft_cost:
      Iron: 10
      Stone: 10
    weight: 3.0
    max_stack: 10
    classification: modern
    required_rank: null

  - key: plasma_grenade
    name: Plasma Grenade
    category: throwable
    effect:
      type: aoe_damage
      bomb_type: grenade
      amount: 70
      radius: 2
      range: 6
      fuse_min: 1
      fuse_max: 10
      fuse_default: 3
    craft_cost:
      Energy: 25
      Circuits: 10
    weight: 3.0
    max_stack: 10
    classification: futuristic
    required_rank: Staff_Sergeant

  # ------------------------------------------------------------------ #
  #  Mines (Supply). Armed in place with `arm <mine>` (no throw); the set fuse
  #  then ticks down before the AoE explosion on the arming tile. `bomb_type:
  #  mine`; no `range` (not thrown). Longer fuse ceilings than grenades so they
  #  can be laid as timed traps.
  # ------------------------------------------------------------------ #
  - key: land_mine
    name: Land Mine
    category: mine
    effect:
      type: aoe_damage
      bomb_type: mine
      amount: 60
      radius: 1
      fuse_min: 1
      fuse_max: 30
      fuse_default: 5
    # Terra-craftable basics only (see medkit): the land mine is a freely
    # craftable anti-armor equalizer new players rely on. Was Iron 15 / Energy 5.
    craft_cost:
      Iron: 15
      Stone: 5
    weight: 4.0
    max_stack: 10
    classification: modern
    required_rank: null

  - key: proximity_mine
    name: Proximity Mine
    category: mine
    effect:
      type: aoe_damage
      bomb_type: mine
      amount: 90
      radius: 2
      fuse_min: 1
      fuse_max: 30
      fuse_default: 5
    craft_cost:
      Iron: 20
      Energy: 20
      Circuits: 10
    weight: 5.0
    max_stack: 10
    classification: futuristic
    required_rank: Staff_Sergeant

  # ------------------------------------------------------------------ #
  #  Inserts (Supply — Blacksmith weapon mods, item-loot-economy §4.3).
  #  Counted, slotless consumables applied to an equipped weapon via the
  #  `insert` command at the Blacksmith bench (task 4.3). insert_effect is
  #  the applied payload: damage_type converts the weapon's typed damage,
  #  range adds flat range, stat adds to a rolled stat (with an optional
  #  tradeoff). Never rolled (no roll_spec — R1.3-adjacent: supplies stay
  #  fixed). All four are rank-gated because every recipe needs a resource
  #  that is not on the Terra starter planet (Circuits/Magmite), which the
  #  freely-craftable invariant forbids for ungated items.
  # ------------------------------------------------------------------ #
  - key: venom_coating
    name: Venom Coating
    category: insert
    insert_effect:
      type: damage_type
      value: poison
    craft_cost:
      Biomass: 20
      Circuits: 10
    weight: 1.0
    max_stack: 10
    classification: futuristic
    required_rank: Staff_Sergeant

  - key: extended_barrel
    name: Extended Barrel
    category: insert
    insert_effect:
      type: range
      value: 2
    craft_cost:
      Iron: 20
      Circuits: 10
    weight: 2.0
    max_stack: 10
    classification: modern
    required_rank: Corporal

  - key: incendiary_core
    name: Incendiary Core
    category: insert
    insert_effect:
      type: damage_type
      value: fire
    craft_cost:
      Magmite: 15
    weight: 1.0
    max_stack: 10
    classification: futuristic
    required_rank: Major

  - key: hollowpoint
    name: Hollow-Point Kit
    category: insert
    insert_effect:
      type: stat
      stat: damage
      value: 4
      tradeoff:
        range: -1
    craft_cost:
      Iron: 15
      Circuits: 5
    weight: 0.5
    max_stack: 10
    classification: modern
    required_rank: Corporal

# Production routing by building (task 8.3).
#
# NOTE: There is no `AA` building — the sole equipment/Armory building is `AR`
# (see buildings.yaml; abbreviations are HQ/EX/AC/LB/AR/TU/VT/RD/WL/BK/MB/RL).
# The design's "AA -> armor" is therefore folded into `AR`, which produces all
# MODERN gear + ammo (weapons, ammo, armor, accessories). Futuristic-class gear
# and throwables route to the Lab (`LB`), consumables to the Medbay (`MB`).
# Each item is produced by exactly one building (no crossover). cross_validate
# requires every key to be a real building abbreviation and every listed item
# to exist — both hold here.
#
# Task 8.4 must extend EQUIPMENT_BUILDING_TYPES (currently ("AA","AR")) in
# world/systems/equipment_system.py to include "MB" and "LB" so production
# actually runs for those buildings; this task only authors the data.
production_map:
  # Armory: modern weapons + ammo + modern armor + modern accessories
  AR:
    - combat_knife
    - assault_rifle
    - sniper_rifle
    - service_rifle
    - rifle_rounds
    - combat_helmet
    - kevlar_vest
    - combat_gloves
    - combat_greaves
    - combat_boots
    - scope
    - hauler_pack
    - thermal_cloak
    - targeting_visor
    # Modern-classification inserts (item-loot-economy task 4.2) follow the
    # classification routing convention: modern -> AR.
    - extended_barrel
    - hollowpoint
  # Medbay: consumables
  MB:
    - medkit
    - combat_stim
  # Lab: futuristic gear
  # The typed-damage weapons (incendiary_rifle, psi_blade, blast_launcher)
  # route here as futuristic-class gear (item-loot-economy R10.7 / design §7 —
  # they shipped with a craft_cost but were absent from every catalog, making
  # them uncraftable).
  # Grenades and mines used to route here too; they now belong to the Munitions
  # Plant (MP) below, which is the dedicated bomb works. The classification
  # routing convention (futuristic -> LB) still governs GEAR and inserts; bombs
  # are routed by PURPOSE instead, so a player who wants explosives builds the
  # plant rather than the whole research chain.
  LB:
    - plasma_rifle
    - incendiary_rifle
    - psi_blade
    - blast_launcher
    - power_armor
    - jetpack
    - raider_talisman
    - energy_cell
    # Futuristic-classification inserts (item-loot-economy task 4.2):
    # futuristic -> LB.
    - venom_coating
    - incendiary_core
  # Munitions Plant: every bomb — grenades (thrown) and mines (armed in place).
  # One item, one producer: these keys appear in NO other catalog, so the plant
  # is the only way to make explosives by hand or passively via an Engineer.
  MP:
    - frag_grenade
    - plasma_grenade
    - land_mine
    - proximity_mine
