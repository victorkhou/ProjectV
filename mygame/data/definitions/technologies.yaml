#   damage / damage_reduction / building_hp → CombatEngine + building hp path
#   weapon_range                            → CombatEngine._resolve_weapon_range
#   sight_range                             → FogOfWar player vision
#   production_multiplier / build_cost_mult → production + build-cost paths

