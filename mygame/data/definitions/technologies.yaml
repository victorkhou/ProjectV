# Lieutenant-gated Advanced Weapons.
- name: Field Marksmanship
  key: field_marksmanship
  tree: weapons
  required_rank: Corporal
  resource_cost:
    Iron: 60
    Energy: 20
  research_ticks: 30
  effect_type: stat_bonus
  effect_value:
    damage: 5

# Weapons: a second, small range step (stacks with Ballistics Optimization
# toward balance.max_weapon_range — the consumer clamps the total).
- name: Munitions Refinement
  key: munitions_refinement
  tree: weapons
  required_rank: Colonel
  resource_cost:
    Iron: 280
    Circuits: 110
    Energy: 90
  research_ticks: 95
  effect_type: stat_bonus
  effect_value:
    weapon_range: 1

