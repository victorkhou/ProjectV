# Technology definitions for RTS Combat Overworld
# required_rank gates align to the R13.4 ladder: the earliest tech is
# researchable at the new Lab gate (Corporal, L11); the rest space upward.
#
# TREES (research-lab-trees feature). Every tech declares a `tree` naming the
# specialized lab that hosts it (world.constants.RESEARCH_TREES):
#   weapons  — Weapons Lab (WX):  offense — weapon damage/range, crafted gear.
#   defense  — Defense Lab (DF):  survivability — building HP, armor.
#   resource — Resource Lab (RX): economy — production, build cost, salvage.
#   research — Research Lab (LB): the generalist line — terrain affinities,
#              vision, and utility techs (the original Lab's tree).
# A player owns ONE research lab per planet, so a tree is a strategic choice;
# every tree has exactly one lab (cross-validated at load). Adding a tech is a
# pure data edit — pick its tree and the owning lab already gates it.

# ── Defense tree (Defense Lab, DF) ──────────────────────────────────
- name: Reinforced Walls
  key: reinforced_walls
  tree: defense
  required_rank: Corporal
  resource_cost:
    Stone: 100
    Iron: 50
  research_ticks: 30
  effect_type: stat_bonus
  effect_value:
    building_hp: 50

# ── Weapons tree (Weapons Lab, WX) ──────────────────────────────────
- name: Advanced Weapons
  key: advanced_weapons
  tree: weapons
  required_rank: Lieutenant
  resource_cost:
    Iron: 150
    Energy: 50
  research_ticks: 60
  effect_type: stat_bonus
  effect_value:
    damage: 10

- name: Improved Armor
  key: improved_armor
  tree: defense
  required_rank: Sergeant
  resource_cost:
    Iron: 80
    Stone: 60
  research_ticks: 40
  effect_type: stat_bonus
  effect_value:
    damage_reduction: 5

# ── Research tree (Research Lab, LB) — vision, terrain, utility ──────
- name: Extended Range
  key: extended_range
  tree: research
  required_rank: Staff_Sergeant
  resource_cost:
    Iron: 100
    Circuits: 30
  research_ticks: 50
  effect_type: stat_bonus
  effect_value:
    sight_range: 2

# ── Resource tree (Resource Lab, RX) ────────────────────────────────
- name: Rapid Production
  key: rapid_production
  tree: resource
  required_rank: Captain
  resource_cost:
    Iron: 200
    Energy: 100
    Circuits: 50
  research_ticks: 90
  effect_type: production_bonus
  effect_value:
    production_multiplier: 1.5

# Reactive Plating (item-loot-economy R11.3): a second damage_reduction tech
# stacking with Improved Armor toward the aggregate permanent-DR cap
# (perm_bonus_cap_dr = 6). Improved Armor (5) + Reactive Plating (3) = 8,
# clamped to 6 by the existing combat_engine armor path — data-only.
- name: Reactive Plating
  key: reactive_plating
  tree: defense
  required_rank: Major
  resource_cost:
    Iron: 250
    Circuits: 80
    Energy: 60
  research_ticks: 80
  effect_type: stat_bonus
  effect_value:
    damage_reduction: 3

# Salvage Protocols (item-loot-economy R11.2, task 5.4): economy research
# that cuts the Blacksmith reroll bench charge (Salvage + resources) to
# ×0.75 (−25%). Consumed by EquipmentSystem._salvage_cost_multiplier —
# clamped to [SALVAGE_COST_MULT_FLOOR, 1.0] so stacked cost research can
# never trivialize the reroll sink nor raise costs (R11.7: live consumer,
# no dead key). The insert "cost" is the consumed insert item itself, so
# this tech deliberately reduces the reroll charge only. Captain-gated:
# a mid/late economy tech that lands with the Phase-5 salvage loop.
- name: Salvage Protocols
  key: salvage_protocols
  tree: resource
  required_rank: Captain
  resource_cost:
    Iron: 200
    Circuits: 60
    Energy: 80
  research_ticks: 75
  effect_type: stat_bonus
  effect_value:
    salvage_cost_mult: 0.75
