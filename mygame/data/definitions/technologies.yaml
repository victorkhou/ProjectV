# Reactive Plating (item-loot-economy R11.3): a second damage_reduction tech
# stacking with Improved Armor toward the aggregate permanent-DR cap
# (perm_bonus_cap_dr = 6). Improved Armor (5) + Reactive Plating (3) = 8,
# clamped to 6 by the existing combat_engine armor path — data-only.
- name: Reactive Plating
  key: reactive_plating
  required_rank: Major
  resource_cost:
    Iron: 250
    Circuits: 80
    Energy: 60
  research_ticks: 80
  effect_type: stat_bonus
  effect_value:
    damage_reduction: 3

# Salvage Protocols (item-loot-economy R11.2, task 5.4): economy research
# that cuts the Blacksmith reroll bench charge (Salvage + resources) to
# ×0.75 (−25%). Consumed by EquipmentSystem._salvage_cost_multiplier —
# clamped to [SALVAGE_COST_MULT_FLOOR, 1.0] so stacked cost research can
# never trivialize the reroll sink nor raise costs (R11.7: live consumer,
# no dead key). The insert "cost" is the consumed insert item itself, so
# this tech deliberately reduces the reroll charge only. Captain-gated:
# a mid/late economy tech that lands with the Phase-5 salvage loop.
- name: Salvage Protocols
  key: salvage_protocols
  required_rank: Captain
  resource_cost:
    Iron: 200
    Circuits: 60
    Energy: 80
  research_ticks: 75
  effect_type: stat_bonus
  effect_value:
    salvage_cost_mult: 0.75
