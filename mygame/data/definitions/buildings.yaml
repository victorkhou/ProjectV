# Research Lab — the GENERALIST research building (research-lab-trees feature).
# Hosts the `research` technology tree: vision, terrain affinities, and utility
# techs (the original Lab's line, kept intact for continuity). It is one of the
# four specialized labs; a player may own only ONE research lab per planet
# (BuildingSystem._validate_one_research_lab_per_planet), so building this
# commits the planet to the research tree. The `research_lab` capability lets
# the tech system find the lab and read its `research_tree`; research is gated
